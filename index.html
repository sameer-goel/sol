<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Act I · Director's Cut — The Meaningful World</title>

  <link rel="stylesheet" href="styles.css?v=20260506-1020">

  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body data-build="20260506-1020">

  <!-- Build stamp so cache staleness is obvious at a glance -->
  <div id="build-stamp" aria-hidden="true">director's cut · build 20260506-1020</div>

  <!-- ========================================================
       z=0 · Globe (masked by a scroll-driven porthole)
       ======================================================== -->
  <div id="scene-root"></div>

  <!-- ========================================================
       z=1 · Starfield + bloom effects
       ======================================================== -->
  <canvas id="stars-canvas" aria-hidden="true"></canvas>
  <div id="bloom-layer" aria-hidden="true">
    <div class="bloom warm"></div>
    <div class="bloom cool"></div>
    <div class="bloom fused"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Bluish atmosphere halo · tight rim when Earth arrives (elevation-only). -->
  <div id="atmosphere" aria-hidden="true"></div>

  <!-- ========================================================
       z=2 · The two intelligences. Canvas-driven, scroll-timed.
       ======================================================== -->
  <div id="stage">

    <!-- Inner intelligence · warm · "why" · grows dendritically -->
    <div class="intel inner-intel">
      <canvas class="intel-canvas" id="inner-canvas"></canvas>
      <div class="intel-ring" aria-hidden="true"></div>
    </div>

    <!-- Artificial intelligence · cool · "how" · propagates layer-by-layer -->
    <div class="intel artificial-intel">
      <canvas class="intel-canvas" id="artificial-canvas"></canvas>
      <div class="intel-ring" aria-hidden="true"></div>
    </div>

    <!-- No in-stage card · the letterbox section below takes over during menu -->

  </div>

  <!-- ========================================================
       z=4 · Letterbox · split-letter menu. Full 7 roster on the
       left (active promoted to cinematic serif). Right side is
       the active category's glyph + tagline + project links.
       Scroll is the only navigation — one viewport per category.
       ======================================================== -->
  <section id="letterbox" aria-hidden="true" aria-label="Solutions portfolio">
    <div class="lb-inner">
      <ol class="lb-roster" id="lb-roster"></ol>
      <aside class="lb-stack" id="lb-stack"></aside>
    </div>
  </section>

  <!-- ========================================================
       z=3 · Narration layer. Full-viewport editorial type.
       One beat visible at a time. Climax beat is centered & large.
       ======================================================== -->
  <div id="narration" aria-live="polite">
    <div class="beat" data-beat="0">
      <div class="eyebrow">Act I</div>
      <div class="line">Two intelligences, <em>one mission.</em></div>
    </div>
    <div class="beat" data-beat="1" data-side="inner">
      <div class="eyebrow">Inner intelligence</div>
      <div class="line">knows <em class="why">why.</em></div>
      <div class="sub">Meaning · Feeling · Purpose</div>
    </div>
    <div class="beat" data-beat="2" data-side="ai">
      <div class="eyebrow">Artificial intelligence</div>
      <div class="line">knows <em class="how">how.</em></div>
      <div class="sub">Tools · Systems · Application</div>
    </div>
    <div class="beat" data-beat="4" data-side="both">
      <div class="line">When they meet&hellip;</div>
    </div>
    <div class="beat climax" data-beat="5">
      <div class="line">A <em class="earth">Meaningful World</em> of Tomorrow.</div>
    </div>
  </div>

  <!-- Subtle scroll cue, bottom center. Fades after first scroll. -->
  <div id="scroll-cue" aria-hidden="true">
    <span>scroll</span>
    <svg viewBox="0 0 12 16" width="12" height="16">
      <path d="M6 1 V15 M1 10 L6 15 L11 10" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Spacer — 600vh so we get room for all 7 beats to breathe -->
  <div id="scroll-spacer" aria-hidden="true"></div>

  <!-- Earth engine (reused from the canonical tree) -->
  <script type="module" src="./earth-scene.js"></script>
  <script src="director.js?v=20260506-1020"></script>

</body>
</html>
